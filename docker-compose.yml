services:
  db:
    image: postgres:15-alpine
    container_name: contas-em-dia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: contasedia
      POSTGRES_USER: contasedia
      POSTGRES_PASSWORD: contasedia_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contasedia -d contasedia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
