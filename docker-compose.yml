services:
  db:
    image: postgres:15-alpine
    container_name: contas-em-dia-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: contasedia
      POSTGRES_USER: contasedia
      POSTGRES_PASSWORD: contasedia_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contasedia -d contasedia"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: "3000"
      NODE_ENV: production
      DATABASE_URL: "postgresql://contasedia:contasedia_local@db:5432/contasedia?schema=public"
      CORS_ORIGINS: "http://localhost:5174,http://127.0.0.1:5174"
      TRUST_PROXY_HOPS: "0"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 6

volumes:
  postgres_data:
