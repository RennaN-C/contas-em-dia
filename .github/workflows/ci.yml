name: Qualidade Saldo Plus
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste_ci
          POSTGRES_DB: saldo_plus_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U teste -d saldo_plus_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://teste:teste_ci@localhost:5432/saldo_plus_test
      JWT_SECRET: segredo-exclusivo-para-ci-nao-utilizar-em-producao
      NODE_ENV: test
      RUN_DATABASE_TESTS: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high

  docker-smoke:
    name: Docker Compose — stack completa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preparar configurações locais descartáveis
        run: |
          cp backend/.env.example backend/.env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" backend/.env
      - name: Validar configuração Docker Compose
        run: docker compose config --quiet
      - name: Construir e iniciar os três serviços
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Verificar healthchecks e acesso HTTP
        run: |
          docker compose ps
          curl --fail --silent --show-error http://127.0.0.1:3000/api/health | grep -q '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:5174/api/health | grep -q '"status":"ok"'
          curl --fail --silent --show-error http://127.0.0.1:5174/ | grep -q '<div id="root"'
      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail=100 || true
      - name: Desligar containers sem apagar dados
        if: always()
        run: docker compose down
